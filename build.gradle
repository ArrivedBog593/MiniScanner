plugins {
    id 'java'
    id 'application'
}

repositories { mavenCentral() }

dependencies {
    implementation 'net.java.dev.jna:jna-platform:5.14.0'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// JNA carga código nativo para llamar a Windows. Desde Java 22 eso da un aviso, y en el futuro Java lo
// bloqueará si no se permite explícitamente: se permite en los tests, en «gradlew run» y en el .jar.
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

test {
    useJUnitPlatform()
    // Las pruebas del escáner simulan 16-32 MB de memoria del juego
    maxHeapSize = '1g'
    jvmArgs nativeAccess
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'miniscanner.MiniScanner'
    applicationDefaultJvmArgs = [nativeAccess]
}

// .jar "gordo": incluye JNA para que funcione con doble clic
jar {
    // Enable-Native-Access: lo mismo que nativeAccess, pero para «java -jar» y el doble clic (las versiones de
    // Java anteriores a la 22 ignoran este atributo)
    manifest { attributes 'Main-Class': 'miniscanner.MiniScanner', 'Enable-Native-Access': 'ALL-UNNAMED' }
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// «gradlew paquete»: carpeta con MiniScanner.exe y su propio Java dentro (no hace falta instalar Java),
// y un .zip de esa carpeta para pasarlo a otra PC. Usa el jpackage del JDK con el que corre Gradle.
def appImage = layout.buildDirectory.dir('paquete')

tasks.register('appImage', Exec) {
    description = 'Arma build/paquete/MiniScanner con MiniScanner.exe y un Java reducido.'
    dependsOn jar
    inputs.file jar.archiveFile
    outputs.dir appImage
    def jpackage = "${System.getProperty('java.home')}/bin/jpackage"
    def jarFile = jar.archiveFile.get().asFile
    def dest = appImage.get().asFile
    doFirst { delete dest }
    commandLine jpackage, '--type', 'app-image',
            '--name', 'MiniScanner',
            '--input', jarFile.parent, '--main-jar', jarFile.name,
            '--dest', dest,
            // Solo los módulos que usa (jdeps), más los textos en español de Java: ~45 MB en vez del JDK entero
            '--add-modules', 'java.base,java.desktop,java.logging,java.prefs,java.xml,jdk.localedata',
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files --include-locales=en,es',
            '--java-options', nativeAccess
}

tasks.register('paquete', Zip) {
    description = 'Comprime build/paquete/MiniScanner en build/paquete/MiniScanner.zip.'
    group = 'distribution'
    dependsOn 'appImage'
    from(appImage.map { it.dir('MiniScanner') }) { into 'MiniScanner' }
    destinationDirectory = appImage
    archiveFileName = 'MiniScanner.zip'
}
